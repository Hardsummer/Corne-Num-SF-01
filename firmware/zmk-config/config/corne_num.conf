# Report the right half's battery level to the computer, via the left half.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep after 30 min idle; a keypress wakes it (the halves reconnect in a second or two).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Clone nRF52840 boards: use the chip's internal 32 kHz clock instead of the board's crystal.
# A weak or out-of-spec crystal makes the halves lose sync after idle/sleep, so the right half
# never reconnects until both are power-cycled. Costs a little battery.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Stronger radio between the halves and to the computer (ZMK docs: power difference is negligible).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
